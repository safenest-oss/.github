name: Bug report
description: Something is not working, or content slipped through
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem. If content slipped through a block, say where it appeared.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130
  - type: textarea
    id: extra
    attributes:
      label: Extra details
      description: Screenshots or the element's tag name from DevTools help a lot. Do not include personal information about a child.
